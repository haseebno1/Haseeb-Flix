name: Release

# Tag pushes publish a release. Manual runs build and verify a signed APK artifact only.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Read version and check it matches the tag
        id: ver
        run: |
          NAME=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          CODE=$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts)
          if [ -z "$NAME" ] || [ -z "$CODE" ]; then
            echo "::error::Could not read versionName/versionCode from app/build.gradle.kts"
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            TAG="${GITHUB_REF_NAME#v}"
            if [ "$NAME" != "$TAG" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match versionName $NAME in app/build.gradle.kts"
              exit 1
            fi
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Check signing and API key secrets exist
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.ANDROID_KEY_ALIAS }}
          KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
          TMDB: ${{ secrets.TMDB_API_KEY }}
        run: |
          # Without these the build could silently fall back to the debug key.
          for v in KS KSP KA KP TMDB; do
            if [ -z "${!v}" ]; then echo "::error::Missing repository secret for $v (see README, Releasing)"; exit 1; fi
          done

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Write keystore
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.ANDROID_KEY_ALIAS }}
          KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$KSP"
            echo "keyAlias=$KA"
            echo "keyPassword=$KP"
          } > keystore.properties

      - name: Build signed release APK
        env:
          HASEEBFLIX_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Verify TMDB API key access
        env:
          TMDB: ${{ secrets.TMDB_API_KEY }}
        run: |
          RESPONSE="$RUNNER_TEMP/tmdb-configuration.json"
          curl --fail --silent --show-error --get \
            --data-urlencode "api_key=$TMDB" \
            --output "$RESPONSE" \
            https://api.themoviedb.org/3/configuration
          python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); assert d.get("images", {}).get("base_url"), "TMDB configuration response missing images.base_url"' "$RESPONSE"
          echo "TMDB configuration endpoint accepted the configured key."

      - name: Verify APK package, version, and signature
        id: apk
        run: |
          SRC=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)
          test -n "$SRC"
          OUT="HaseebFlix-v${{ steps.ver.outputs.name }}.apk"
          cp "$SRC" "$OUT"
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt | sort -V | tail -n 1)
          BADGING=$("$AAPT" dump badging "$OUT")
          echo "$BADGING" | grep -q "package: name='com.haseebno1.haseebflix' versionCode='${{ steps.ver.outputs.code }}' versionName='${{ steps.ver.outputs.name }}'"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --print-certs "$OUT" | tee signer.txt
          if grep -qi "Android Debug" signer.txt; then echo "::error::APK is signed with the debug key"; exit 1; fi
          sha256sum "$OUT" > "$OUT.sha256"
          echo "file=$OUT" >> "$GITHUB_OUTPUT"

      - name: Build release notes
        if: github.event_name == 'push'
        run: |
          CL="fastlane/metadata/android/en-US/changelogs/${{ steps.ver.outputs.code }}.txt"
          {
            if [ -f "$CL" ]; then cat "$CL"; else echo "See the commit history for changes."; fi
            echo
            echo "SHA-256:"
            echo '```'
            cat "${{ steps.apk.outputs.file }}.sha256"
            echo '```'
          } > notes.md

      - name: Upload signed verification APK
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: HaseebFlix-verified-v${{ steps.ver.outputs.name }}
          path: |
            ${{ steps.apk.outputs.file }}
            ${{ steps.apk.outputs.file }}.sha256
            signer.txt
          retention-days: 14

      - uses: softprops/action-gh-release@v2
        if: github.event_name == 'push'
        with:
          name: HaseebFlix ${{ steps.ver.outputs.name }}
          body_path: notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            ${{ steps.apk.outputs.file }}
            ${{ steps.apk.outputs.file }}.sha256
